spring.application.name=SuperStats

spring.datasource.url=jdbc:mysql://localhost:3306/superstats?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

tmdb.api.key=${TMDB_API_KEY}
comicvine.api.key=${COMICVINE_API_KEY}