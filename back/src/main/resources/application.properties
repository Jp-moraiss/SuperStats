spring.application.name=SuperStats

spring.datasource.url=jdbc:postgresql://${DBHOST:localhost:5432}/superstats
spring.datasource.username=${SUPERSTATS_USER}
spring.datasource.password=${SUPERSTATS_POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.schemas=public

tmdb.api.key=${TMDB_API_KEY}
comicvine.api.key=${COMICVINE_API_KEY}
superhero.api.token=${SUPERHERO_API_TOKEN}
secret.jwt.key=${SECRET_KEY_JWT_SUPERSTATS}

spring.flyway.clean-disabled=false

spring.main.banner-mode=off