<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>SuperStats - Análises e Gráficos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { padding: 20px; background-color: #f4f4f4; }
        .chart-container {
            position: relative;
            margin: auto;
            height: 60vh;
            width: 80vw;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="mb-0">SuperStats - Análises</h1>
        <div>
            <a href="login.html" class="btn btn-secondary">Ir para a Home</a>
            <button class="btn btn-danger" onclick="handleLogout()">Logout</button>
        </div>
    </div>

    <div class="card mb-4">
        <div class="card-header">
            <h3>Ranking de Popularidade - Produtoras de Filmes</h3>
        </div>
        <div class="card-body">
            <div id="filmesChartContainer" class="chart-container">
                <canvas id="filmesChart"></canvas>
            </div>
        </div>
    </div>

    <div class="card">
        <div class="card-header">
            <h3>Ranking de Popularidade - Editoras de HQs</h3>
        </div>
        <div class="card-body">
            <div id="hqsChartContainer" class="chart-container">
                <canvas id="hqsChart"></canvas>
            </div>
        </div>
    </div>
</div>

<script>
    const apiBaseUrl = 'http://localhost:8080';

    document.addEventListener('DOMContentLoaded', () => {
        if (!localStorage.getItem('jwtToken')) {
            window.location.href = 'login.html';
        } else {
            loadCharts();
        }
    });

    function handleLogout() {
        localStorage.removeItem('jwtToken');
        window.location.href = 'login.html';
    }

    async function fetchWithAuth(url, options = {}) {
        const token = localStorage.getItem('jwtToken');
        if (!token) handleLogout();
        const headers = { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}`, ...options.headers };
        const response = await fetch(url, { ...options, headers });
        if (response.status === 401 || response.status === 403) handleLogout();
        return response;
    }

    async function loadCharts() {
        try {
            const res = await fetchWithAuth(`${apiBaseUrl}/analises/popularidade-empresas`);
            if (!res.ok) throw new Error('Falha ao carregar dados de popularidade.');

            const data = await res.json();

            // Separa os dados em dois arrays: um para filmes, outro para HQs
            const filmesData = data.filter(item => item.tipoMidia === 'Filme');
            const hqsData = data.filter(item => item.tipoMidia === 'HQ');

            renderChart('filmesChart', 'filmesChartContainer', filmesData, 'Produtoras de Filmes', 'Nº de Filmes Assistidos', 'rgba(54, 162, 235, 0.6)');
            renderChart('hqsChart', 'hqsChartContainer', hqsData, 'Editoras de HQs', 'Nº de HQs Lidas', 'rgba(255, 99, 132, 0.6)');

        } catch (error) {
            console.error(error);
            document.getElementById('filmesChartContainer').innerHTML = `<p class="text-danger text-center">${error.message}</p>`;
            document.getElementById('hqsChartContainer').innerHTML = `<p class="text-danger text-center">${error.message}</p>`;
        }
    }

    function renderChart(canvasId, containerId, data, label, axisLabel, color) {
        const container = document.getElementById(containerId);
        if (data.length === 0) {
            container.innerHTML = `<p class="text-center">Nenhum dado de consumo encontrado para esta mídia.</p>`;
            return;
        }

        const labels = data.map(item => item.empresaNome);
        const values = data.map(item => item.totalConsumido);

        const ctx = document.getElementById(canvasId).getContext('2d');
        new Chart(ctx, {
            type: 'bar', // Tipo de gráfico: barras
            data: {
                labels: labels,
                datasets: [{
                    label: label,
                    data: values,
                    backgroundColor: color,
                    borderColor: color.replace('0.6', '1'),
                    borderWidth: 1
                }]
            },
            options: {
                indexAxis: 'y', // Faz o gráfico de barras ser horizontal
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    x: {
                        beginAtZero: true,
                        title: {
                            display: true,
                            text: axisLabel
                        }
                    }
                },
                plugins: {
                    legend: {
                        display: false
                    }
                }
            }
        });
    }
</script>
</body>
</html>
