<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>SuperStats - Catálogo de Filmes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body { padding: 20px; background-color: #f4f4f4; }
        .section { margin-bottom: 2rem; }
        .movie-card img { height: 400px; object-fit: cover; }
        .search-result-card { cursor: pointer; }
        .search-result-card:hover { background-color: #e9ecef; transition: background-color 0.2s; }
    </style>
</head>
<body>
<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="mb-0">SuperStats - Catálogo de Filmes</h1>
        <div>
            <a href="login.html" class="btn btn-secondary">Ir para a Home</a>
            <button class="btn btn-danger" onclick="handleLogout()">Logout</button>
        </div>
    </div>

    <ul class="nav nav-tabs" id="filmesTab" role="tablist">
        <li class="nav-item" role="presentation"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#todos-filmes-pane" type="button" role="tab">Catálogo de Filmes</button></li>
        <li class="nav-item" role="presentation"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#assistidos-pane" type="button" role="tab">Meus Assistidos</button></li>
        <li class="nav-item" role="presentation"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#gerenciar-pane" type="button" role="tab">Adicionar Filme</button></li>
    </ul>

    <div class="tab-content" id="filmesTabContent">
        <div class="tab-pane fade show active p-3 border border-top-0" id="todos-filmes-pane" role="tabpanel">
            <div id="catalogoContainer" class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-4"></div>
        </div>
        <div class="tab-pane fade p-3 border border-top-0" id="assistidos-pane" role="tabpanel">
            <table class="table table-striped"><thead><tr><th>ID</th><th>Título</th><th>Produtora</th><th>Diretor</th><th>Avaliação TMDB</th></tr></thead><tbody id="assistidosTableBody"></tbody></table>
        </div>
        <div class="tab-pane fade p-3 border border-top-0" id="gerenciar-pane" role="tabpanel">
            <h3>Adicionar Novo Filme ao Catálogo</h3>
            <div class="section">
                <p class="text-muted small">Digite o título do filme (em inglês) para buscá-lo na base de dados do TMDB.</p>
                <div class="input-group">
                    <input type="text" id="tituloBusca" class="form-control" placeholder="Ex: Inception, The Lord of the Rings">
                    <button class="btn btn-primary" type="button" onclick="searchFilmes()">Buscar Filme</button>
                </div>
            </div>
            <hr>
            <div class="section">
                <h4 id="statusBusca">Resultados da Busca</h4>
                <div id="searchResultsContainer" class="row row-cols-1 row-cols-sm-2 row-cols-md-3 g-4 mt-1"></div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const baseUrl = 'http://localhost:8080/filmes';

    document.addEventListener('DOMContentLoaded', () => { if (!localStorage.getItem('jwtToken')) { window.location.href = 'login.html'; } else { refreshAll(); } });
    function handleLogout() { localStorage.removeItem('jwtToken'); window.location.href = 'login.html'; }
    async function fetchWithAuth(url, options = {}) {
        const token = localStorage.getItem('jwtToken');
        const headers = { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}`, ...options.headers };
        const response = await fetch(url, { ...options, headers });
        if (response.status === 401) { handleLogout(); }
        return response;
    }

    async function getAll() {
        try {
            const res = await fetchWithAuth(baseUrl);
            const data = await res.json();
            const container = document.getElementById('catalogoContainer');
            container.innerHTML = "";
            if (data.length === 0) {
                container.innerHTML = '<p class="text-center col-12">Nenhum filme no catálogo. Adicione um na aba "Adicionar Filme".</p>';
                return;
            }
            data.forEach(filme => {
                const assistidoBtn = filme.assistido ? `<button class="btn btn-outline-secondary btn-sm" onclick="removerDosAssistidos(${filme.id})">Remover ✖</button>` : `<button class="btn btn-success btn-sm" onclick="marcarComoAssistido(${filme.id})">Assistido ✓</button>`;
                const trailerBtn = filme.trailerUrl ? `<a href="${filme.trailerUrl}" target="_blank" class="btn btn-danger btn-sm"><i class="bi bi-youtube"></i> Trailer</a>` : '';
                const cardHtml = `<div class="col"><div class="card h-100 movie-card"><img src="${filme.posterUrl || 'https://via.placeholder.com/500x750.png?text=Sem+Pôster'}" class="card-img-top" alt="Pôster de ${filme.titulo}"><div class="card-body d-flex flex-column"><h5 class="card-title">${filme.titulo}</h5><p class="card-text text-muted small">${filme.produtora || 'Produtora não informada'}</p><div class="mt-auto"><p class="mb-2"><strong>Avaliação TMDB:</strong> <span class="badge bg-warning text-dark">${filme.avaliacaoTmdb ? filme.avaliacaoTmdb.toFixed(1) : 'N/A'} ⭐</span></p><div class="d-flex justify-content-between">${assistidoBtn}${trailerBtn}<button class="btn btn-outline-danger btn-sm" onclick="deleteFilme(${filme.id})">Deletar</button></div></div></div></div></div>`;
                container.innerHTML += cardHtml;
            });
        } catch(e) { console.error(e) }
    }

    async function fetchAssistidos() {
        const tbody = document.getElementById('assistidosTableBody');
        try {
            const res = await fetchWithAuth(`${baseUrl}/assistidos`);
            const data = await res.json();
            tbody.innerHTML = "";
            if (data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="text-center">Nenhum filme assistido.</td></tr>';
                return;
            }
            data.forEach(filme => {
                tbody.innerHTML += `<tr><td>${filme.id}</td><td>${filme.titulo}</td><td>${filme.produtora || ''}</td><td>${filme.diretor || ''}</td><td>${filme.avaliacaoTmdb ? filme.avaliacaoTmdb.toFixed(1) : 'N/A'}</td></tr>`;
            });
        } catch(e) { console.error(e); }
    }

    function refreshAll() { getAll(); fetchAssistidos(); }
    async function marcarComoAssistido(filmeId) { try { const res = await fetchWithAuth(`${baseUrl}/${filmeId}/assistir`, { method: 'POST' }); if (res.ok) refreshAll(); } catch (error) { console.error(error); } }
    async function removerDosAssistidos(filmeId) { try { const res = await fetchWithAuth(`${baseUrl}/${filmeId}/assistir`, { method: 'DELETE' }); if (res.ok) refreshAll(); } catch (error) { console.error(error); } }
    async function deleteFilme(filmeId) {
        if (!confirm(`Tem certeza que deseja deletar o filme com ID ${filmeId}?`)) return;
        try {
            const res = await fetchWithAuth(`${baseUrl}/${filmeId}`, { method: 'DELETE' });
            if (res.ok) { alert('Filme deletado com sucesso.'); refreshAll(); } else { throw new Error(await res.text()); }
        } catch (error) { alert(`Erro ao deletar: ${error.message}`); }
    }

    async function searchFilmes() {
        const titulo = document.getElementById('tituloBusca').value;
        const container = document.getElementById('searchResultsContainer');
        const status = document.getElementById('statusBusca');
        if (!titulo) return;
        status.textContent = `Buscando por "${titulo}"...`;
        container.innerHTML = '<div class="spinner-border text-primary"></div>';
        try {
            const res = await fetchWithAuth(`${baseUrl}/buscar-externo?titulo=${encodeURIComponent(titulo)}`);
            const results = await res.json();
            container.innerHTML = '';
            if (results.length === 0) { status.textContent = 'Nenhum filme encontrado.'; return; }
            status.textContent = 'Resultados encontrados. Clique no filme correto para adicioná-lo:';
            results.forEach(item => {
                const imageUrl = item.poster_path || 'https://via.placeholder.com/400x600.png?text=Sem+Pôster';
                let dataFormatada = 'N/A';
                if (item.release_date && item.release_date.includes('-')) {
                    const parts = item.release_date.split('-');
                    dataFormatada = parts.length === 3 ? `${parts[2]}/${parts[1]}/${parts[0]}` : item.release_date;
                }
                const cardHtml = `<div class="col"><div class="card h-100 search-result-card" onclick="finalizeFilmeCreation(${item.id})"><img src="${imageUrl}" class="card-img-top" style="height: 300px;" alt="Pôster de ${item.title}"><div class="card-body"><h5 class="card-title">${item.title}</h5><p class="card-text small text-muted">Lançamento: ${dataFormatada}</p></div></div></div>`;
                container.innerHTML += cardHtml;
            });
        } catch (error) { status.textContent = `Erro ao buscar filmes: ${error.message}`; console.error(error); }
    }

    async function finalizeFilmeCreation(tmdbId) {
        const status = document.getElementById('statusBusca');
        status.textContent = "Adicionando o filme selecionado ao catálogo...";
        try {
            const dto = { tmdbId: tmdbId };
            const res = await fetchWithAuth(baseUrl, { method: 'POST', body: JSON.stringify(dto) });
            if (res.ok) {
                const filmeCriado = await res.json();
                status.textContent = `Sucesso! "${filmeCriado.titulo}" adicionado.`;
                document.getElementById('searchResultsContainer').innerHTML = '';
                document.getElementById('tituloBusca').value = '';
                refreshAll();
            } else {
                const errorData = await res.json();
                throw new Error(errorData.message || 'Erro desconhecido ao adicionar filme.');
            }
        } catch (error) { status.textContent = `Erro ao adicionar filme: ${error.message}`; console.error(error); }
    }
</script>
</body>
</html>
