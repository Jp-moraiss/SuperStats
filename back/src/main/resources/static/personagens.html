<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>SuperStats - Adicionar Personagem</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { padding: 20px; }
        .section { margin-bottom: 2rem; }
        .search-result-card { cursor: pointer; }
        .search-result-card:hover { background-color: #e9ecef; }
        .card-img-top { height: 400px; object-fit: cover; background-color: #333; }
    </style>
</head>
<body class="p-3">
<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="mb-0">Adicionar Personagem ao Catálogo</h1>
        <div>
            <a href="login.html" class="btn btn-secondary">Home</a>
            <button class="btn btn-danger ms-2" onclick="handleLogout()">Logout</button>
        </div>
    </div>

    <div class="section">
        <p class="text-muted small">Digite o nome do personagem (em inglês) para buscá-lo na Superhero API.</p>
        <div class="input-group">
            <input type="text" id="nomeBusca" class="form-control" placeholder="Ex: Batman, Spider-Man...">
            <button class="btn btn-primary" type="button" onclick="searchPersonagens()">Buscar</button>
        </div>
    </div>
    <hr>
    <div class="section">
        <h4 id="statusBusca">Resultados da Busca</h4>
        <div id="searchResultsContainer" class="row row-cols-1 row-cols-sm-2 row-cols-md-4 g-4 mt-1"></div>
    </div>
</div>

<script>
    const baseUrl = 'http://localhost:8080/personagens';

    document.addEventListener('DOMContentLoaded', () => { if (!localStorage.getItem('jwtToken')) window.location.href = 'login.html'; });
    function handleLogout() { localStorage.removeItem('jwtToken'); window.location.href = 'login.html'; }
    async function fetchWithAuth(url, options = {}) {
        const token = localStorage.getItem('jwtToken');
        const headers = { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}`, ...options.headers };
        const response = await fetch(url, { ...options, headers });
        if (response.status === 401) handleLogout();
        return response;
    }

    async function searchPersonagens() {
        const nome = document.getElementById('nomeBusca').value;
        const container = document.getElementById('searchResultsContainer');
        const status = document.getElementById('statusBusca');
        if (!nome) { status.textContent = 'Por favor, digite um nome.'; return; }
        status.textContent = `Buscando por "${nome}"...`;
        container.innerHTML = '<div class="spinner-border text-primary"></div>';
        try {
            const res = await fetchWithAuth(`${baseUrl}/buscar-externo?nome=${encodeURIComponent(nome)}`);
            const results = await res.json();
            container.innerHTML = '';
            if (results.length === 0) { status.textContent = 'Nenhum resultado encontrado.'; return; }
            status.textContent = 'Resultados encontrados. Clique no personagem correto para adicioná-lo:';
            results.forEach(item => {
                const imageUrl = item.image?.url || 'https://via.placeholder.com/400x500.png?text=Sem+Imagem';
                const cardHtml = `
                    <div class="col">
                        <div class="card h-100 search-result-card" onclick="finalizePersonagemCreation('${item.id}')">
                            <img src="${imageUrl}" class="card-img-top" alt="Imagem de ${item.name}">
                            <div class="card-body">
                                <h5 class="card-title">${item.name}</h5>
                                <p class="card-text small text-muted">${item.biography['full-name'] || 'Nome completo não disponível'}</p>
                            </div>
                        </div>
                    </div>`;
                container.innerHTML += cardHtml;
            });
        } catch (error) { status.textContent = 'Erro ao buscar personagens.'; console.error(error); }
    }

    async function finalizePersonagemCreation(apiId) {
        const status = document.getElementById('statusBusca');
        status.textContent = "Adicionando o personagem selecionado ao catálogo...";
        try {
            const dto = { apiId: apiId };
            const res = await fetchWithAuth(baseUrl, { method: 'POST', body: JSON.stringify(dto) });
            if (res.ok) {
                const personagemCriado = await res.json();
                status.textContent = `Sucesso! "${personagemCriado.nome}" foi adicionado ao catálogo.`;
                document.getElementById('searchResultsContainer').innerHTML = '';
                document.getElementById('nomeBusca').value = '';
                // Opcional: redirecionar para a página de catálogo
                // window.location.href = 'catalogo-personagens.html';
            } else {
                const errorData = await res.json();
                throw new Error(errorData.message);
            }
        } catch (error) { status.textContent = `Erro ao adicionar personagem: ${error.message}`; }
    }
</script>
</body>
</html>
