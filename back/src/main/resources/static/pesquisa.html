<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>SuperStats - Pesquisa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { padding: 20px; background-color: #f4f4f4; }
        .autocomplete-container { position: relative; }
        .autocomplete-results {
            position: absolute; top: 100%; left: 0; right: 0; z-index: 1000;
            border: 1px solid #ced4da; border-top: none; max-height: 250px; overflow-y: auto;
        }
        .autocomplete-item { padding: 0.5rem; cursor: pointer; background-color: #fff; }
        .autocomplete-item:hover { background-color: #e9ecef; }
    </style>
</head>
<body>
<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="mb-0">Pesquisa de Favoritos</h1>
        <div>
            <a href="login.html" class="btn btn-secondary">Ir para a Home</a>
            <button class="btn btn-danger" onclick="handleLogout()">Logout</button>
        </div>
    </div>

    <div class="card">
        <div class="card-body">
            <p class="lead">Responda às perguntas abaixo buscando no nosso catálogo de personagens.</p>
            <form id="surveyForm" onsubmit="submitSurvey(event)">
                <div id="questionsContainer" class="mb-3"></div>
                <button type="submit" class="btn btn-primary w-100">Enviar Respostas</button>
            </form>
            <div id="submitStatus" class="mt-3"></div>
        </div>
    </div>
</div>

<script>
    const pesquisaBaseUrl = 'http://localhost:8080/pesquisas';
    const personagemBaseUrl = 'http://localhost:8080/personagens';

    document.addEventListener('DOMContentLoaded', () => { if (!localStorage.getItem('jwtToken')) { window.location.href = 'login.html'; } else { loadQuestions(); } });
    function handleLogout() { localStorage.removeItem('jwtToken'); window.location.href = 'login.html'; }
    async function fetchWithAuth(url, options = {}) {
        const token = localStorage.getItem('jwtToken');
        const headers = { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}`, ...options.headers };
        const response = await fetch(url, { ...options, headers });
        if (response.status === 401) { handleLogout(); }
        return response;
    }

    async function loadQuestions() {
        const container = document.getElementById('questionsContainer');
        try {
            const res = await fetchWithAuth(`${pesquisaBaseUrl}/1/perguntas`);
            const questions = await res.json();
            questions.forEach(q => {
                container.innerHTML += `
                    <div class="mb-3">
                        <label for="pergunta-${q.id}" class="form-label">${q.textoPergunta}</label>
                        <div class="autocomplete-container">
                            <input type="text" id="pergunta-${q.id}" class="form-control"
                                   oninput="searchCharacters(this)"
                                   placeholder="Comece a digitar o nome do personagem..."
                                   autocomplete="off"
                                   data-pergunta-id="${q.id}"
                                   data-personagem-id="">
                            <div id="results-${q.id}" class="autocomplete-results list-group"></div>
                        </div>
                    </div>`;
            });
        } catch (error) { container.innerHTML = '<p class="text-danger">Erro ao carregar perguntas.</p>'; }
    }
    async function searchCharacters(inputElement) {
        const searchTerm = inputElement.value;
        const questionId = inputElement.dataset.perguntaId;
        const resultsContainer = document.getElementById(`results-${questionId}`);
        inputElement.dataset.personagemId = '';
        if (searchTerm.length < 2) { resultsContainer.innerHTML = ''; return; }
        try {
            const alignment = inputElement.dataset.alignmentFilter;
            // A chamada para o endpoint de autocomplete permanece a mesma
            let url = `${personagemBaseUrl}/autocomplete?nome=${encodeURIComponent(searchTerm)}`;

            const res = await fetchWithAuth(url);
            const characters = await res.json();
            resultsContainer.innerHTML = '';
            if (characters.length === 0) { resultsContainer.innerHTML = '<div class="autocomplete-item text-muted">Nenhum personagem encontrado.</div>'; }

            characters.forEach(char => {
                const item = document.createElement('a');
                item.href = '#';
                item.className = 'autocomplete-item list-group-item list-group-item-action';

                // --- A CORREÇÃO PRINCIPAL ESTÁ AQUI ---
                // Usamos char.fullName para exibir o nome real
                const displayText = char.fullName && char.fullName !== 'No alter egos found.'
                    ? `${char.name} <small class="text-muted ms-2">- ${char.fullName}</small>`
                    : char.name;

                item.innerHTML = displayText;
                item.onclick = (e) => { e.preventDefault(); selectCharacter(questionId, char.id, char.name); };
                resultsContainer.appendChild(item);
            });
        } catch (error) { console.error(error); }
    }

    function selectCharacter(questionId, charId, charName) {
        const inputElement = document.getElementById(`pergunta-${questionId}`);
        inputElement.value = charName;
        inputElement.dataset.personagemId = charId;
        document.getElementById(`results-${questionId}`).innerHTML = '';
    }

    async function submitSurvey(event) {
        event.preventDefault();
        const statusDiv = document.getElementById('submitStatus');
        statusDiv.textContent = 'Enviando...';
        const inputs = document.querySelectorAll('#questionsContainer input[type="text"]');
        const respostas = [];
        inputs.forEach(input => {
            const personagemId = input.dataset.personagemId; // O ID agora é uma string
            if (personagemId) {
                respostas.push({ perguntaId: parseInt(input.dataset.perguntaId, 10), personagemId: personagemId });
            }
        });
        if(respostas.length === 0){ statusDiv.innerHTML = '<div class="alert alert-warning">Responda ao menos uma pergunta.</div>'; return; }
        try {
            const res = await fetchWithAuth(`${pesquisaBaseUrl}/1/respostas`, { method: 'POST', body: JSON.stringify(respostas) });
            if (res.ok) {
                statusDiv.innerHTML = '<div class="alert alert-success">Obrigado por responder!</div>';
                document.getElementById('surveyForm').reset();
            } else { throw new Error('Falha ao enviar respostas.'); }
        } catch (error) { statusDiv.innerHTML = '<div class="alert alert-danger">Ocorreu um erro.</div>'; console.error(error); }
    }
</script>
</body>
</html>
