<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>SuperStats - Gestão de HQs</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { padding: 20px; background-color: #f4f4f4; }
        .section { margin-bottom: 2rem; }
        .search-result-card { cursor: pointer; }
        .search-result-card:hover { background-color: #e9ecef; transition: background-color 0.2s; }
        .card-img-top { object-fit: cover; }
    </style>
</head>
<body>
<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="mb-0">SuperStats - Catálogo de HQs</h1>
        <div>
            <a href="login.html" class="btn btn-secondary">Ir para a Home</a>
            <button class="btn btn-danger" onclick="handleLogout()">Logout</button>
        </div>
    </div>

    <ul class="nav nav-tabs" id="hqsTab" role="tablist">
        <li class="nav-item" role="presentation"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#todas-hqs-pane" type="button" role="tab">Todas as HQs</button></li>
        <li class="nav-item" role="presentation"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#lidas-pane" type="button" role="tab">HQs Lidas</button></li>
        <li class="nav-item" role="presentation"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#nao-lidas-pane" type="button" role="tab">Baixo Engajamento</button></li>
        <li class="nav-item" role="presentation"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#gerenciar-pane" type="button" role="tab">Adicionar HQ</button></li>
    </ul>

    <div class="tab-content" id="hqsTabContent">
        <div class="tab-pane fade show active p-3 border border-top-0" id="todas-hqs-pane" role="tabpanel">
            <div id="catalogoHqContainer" class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-4"></div>
        </div>
        <div class="tab-pane fade p-3 border border-top-0" id="lidas-pane" role="tabpanel">
            <table class="table table-striped">
                <thead>
                <tr><th>ID</th><th>Título</th><th>Volume</th><th>Editora</th><th>Edição</th><th>Lançamento</th></tr>
                </thead>
                <tbody id="lidosTableBody"></tbody>
            </table>
        </div>
        <div class="tab-pane fade p-3 border border-top-0" id="nao-lidas-pane" role="tabpanel">
            <h4 class="mb-3">HQs Nunca Lidas por Ninguém</h4>
            <div id="naoLidasContainer" class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-4"></div>
        </div>
        <div class="tab-pane fade p-3 border border-top-0" id="gerenciar-pane" role="tabpanel">
            <h3>Adicionar Nova HQ ao Catálogo</h3>
            <div class="section">
                <p class="text-muted small">Para melhores resultados, use o título original em inglês (ex: "The Killing Joke", "Batman").</p>
                <div class="input-group">
                    <input type="text" id="tituloBusca" class="form-control" placeholder="Digite o título da HQ ou da Série...">
                    <button class="btn btn-primary" type="button" onclick="searchHqs()">Buscar na Comic Vine</button>
                </div>
            </div>
            <hr>
            <div class="section">
                <div class="d-flex align-items-center mb-2">
                    <button id="backToSearchBtn" class="btn btn-outline-secondary btn-sm me-3" onclick="goBackToSearch()" style="display: none;">&larr; Voltar</button>
                    <h4 id="statusBusca" class="mb-0">Resultados da Busca</h4>
                </div>
                <div id="searchResultsContainer" class="row row-cols-1 row-cols-sm-2 row-cols-md-3 g-4 mt-1"></div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const baseUrl = 'http://localhost:8080/hqs';
    let lastSearchTerm = '';

    document.addEventListener('DOMContentLoaded', () => { if (!localStorage.getItem('jwtToken')) { window.location.href = 'login.html'; } else { refreshAll(); } });
    function handleLogout() { localStorage.removeItem('jwtToken'); window.location.href = 'login.html'; }
    async function fetchWithAuth(url, options = {}) {
        const token = localStorage.getItem('jwtToken');
        const headers = { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}`, ...options.headers };
        const response = await fetch(url, { ...options, headers });
        if (response.status === 401) { handleLogout(); }
        return response;
    }

    async function getAll() {
        try {
            const res = await fetchWithAuth(baseUrl);
            const data = await res.json();
            const container = document.getElementById('catalogoHqContainer');
            container.innerHTML = "";
            if (data.length === 0) {
                container.innerHTML = '<p class="text-center col-12">Nenhuma HQ no catálogo.</p>';
                return;
            }
            data.forEach(hq => {
                const botao = hq.lido
                    ? `<button class="btn btn-outline-secondary btn-sm" onclick="toggleLidoStatus(this, ${hq.id}, true)">Remover ✖</button>`
                    : `<button class="btn btn-success btn-sm" onclick="toggleLidoStatus(this, ${hq.id}, false)">Lido ✓</button>`;

                let dataFormatada = 'Data não informada';
                if (hq.dataLancamento) {
                    const parts = hq.dataLancamento.split('-');
                    dataFormatada = `${parts[2]}/${parts[1]}`;
                }

                const cardHtml = `
                <div class="col">
                    <div class="card h-100">
                        <img src="${hq.coverUrl || 'https://via.placeholder.com/500x750.png?text=Sem+Capa'}" class="card-img-top" style="height: 400px; object-fit: cover;" alt="Capa de ${hq.titulo}">
                        <div class="card-body d-flex flex-column">
                            <h5 class="card-title">${hq.volumeName}</h5>
                            <p class="card-subtitle mb-2 text-muted">${hq.titulo}</p>
                            <p class="card-text small">${hq.editora || 'Editora não informada'}<br><strong>Lançamento:</strong> ${dataFormatada}</p>
                            <div class="mt-auto text-center">${botao}</div>
                        </div>
                    </div>
                </div>`;
                container.innerHTML += cardHtml;
            });
        } catch(e) { console.error(e) }
    }

    async function fetchLidos() {
        const tbody = document.getElementById('lidosTableBody');
        try {
            const res = await fetchWithAuth(`${baseUrl}/lidos`);
            const data = await res.json();
            tbody.innerHTML = "";
            if (data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="text-center">Nenhuma HQ lida.</td></tr>';
                return;
            }
            data.forEach(hq => {
                let dataFormatada = 'N/A';
                if (hq.dataLancamento) {
                    const parts = hq.dataLancamento.split('-');
                    dataFormatada = `${parts[2]}/${parts[1]}/${parts[0]}`;
                }
                tbody.innerHTML += `<tr><td>${hq.id}</td><td>${hq.titulo}</td><td>${hq.volumeName}</td><td>${hq.editora}</td><td>${hq.edicao || ''}</td><td>${dataFormatada}</td></tr>`;
            });
        } catch(e) { console.error(e) }
    }

    async function fetchNaoLidas() {
        try {
            const res = await fetchWithAuth(`${baseUrl}/nao-lidas`);
            const data = await res.json();
            const container = document.getElementById('naoLidasContainer');
            container.innerHTML = "";
            if (data.length === 0) {
                container.innerHTML = '<p class="text-center col-12">Ótima notícia! Todas as HQs já foram lidas por alguém.</p>';
                return;
            }
            data.forEach(hq => {
                const botao = `<button class="btn btn-success btn-sm" onclick="toggleLidoStatus(this, ${hq.id}, false)">Lido ✓</button>`;
                let dataFormatada = 'Data não informada';
                if (hq.dataLancamento) {
                    const parts = hq.dataLancamento.split('-');
                    dataFormatada = `${parts[2]}/${parts[1]}/${parts[0]}`;
                }
                const cardHtml = `
                <div class="col">
                    <div class="card h-100">
                        <img src="${hq.coverUrl || 'https://via.placeholder.com/500x750.png?text=Sem+Capa'}" class="card-img-top" style="height: 400px; object-fit: cover;" alt="Capa de ${hq.titulo}">
                        <div class="card-body d-flex flex-column">
                            <h5 class="card-title">${hq.volumeName}</h5>
                            <p class="card-subtitle mb-2 text-muted">${hq.titulo}</p>
                            <p class="card-text small">${hq.editora || 'Editora não informada'}<br><strong>Lançamento:</strong> ${dataFormatada}</p>
                            <div class="mt-auto text-center">${botao}</div>
                        </div>
                    </div>
                </div>`;
                container.innerHTML += cardHtml;
            });
        } catch(e) { console.error('Erro ao buscar HQs não lidas:', e) }
    }

    // ==========================================================
    // AQUI ESTÁ A FUNÇÃO CORRIGIDA
    // ==========================================================
    async function toggleLidoStatus(buttonElement, hqId, isCurrentlyLido) {
        const originalHtml = buttonElement.innerHTML;
        const originalClasses = buttonElement.className;

        buttonElement.disabled = true;
        // Atualiza a aparência do botão instantaneamente (UI otimista)
        if (isCurrentlyLido) {
            buttonElement.innerHTML = 'Lido ✓';
            buttonElement.className = 'btn btn-success btn-sm';
        } else {
            buttonElement.innerHTML = 'Remover ✖';
            buttonElement.className = 'btn btn-outline-secondary btn-sm';
        }

        // CORREÇÃO 1: O método é sempre POST
        const method = 'POST';
        // CORREÇÃO 2: O endpoint agora é /toggle-read
        const url = `${baseUrl}/${hqId}/toggle-read`;

        try {
            const res = await fetchWithAuth(url, { method });

            // O novo endpoint retorna 200 OK em ambos os casos (sucesso)
            if (!res.ok) {
                throw new Error('Falha ao atualizar o status no servidor.');
            }

            // Atualiza o onclick do botão para a próxima ação
            buttonElement.setAttribute('onclick', `toggleLidoStatus(this, ${hqId}, ${!isCurrentlyLido})`);

            // Atualiza as outras listas (tabela de lidos, etc.) em segundo plano
            fetchLidos();
            fetchNaoLidas();

        } catch (error) {
            console.error(error);
            alert('Não foi possível atualizar o status da HQ. Tente novamente.');
            // Reverte a aparência do botão em caso de erro
            buttonElement.innerHTML = originalHtml;
            buttonElement.className = originalClasses;
        } finally {
            buttonElement.disabled = false;
        }
    }

    function refreshAll() { getAll(); fetchLidos(); fetchNaoLidas(); }

    // --- Funções de busca e criação (sem alteração) ---
    async function searchHqs(term = null) {
        const titulo = term || document.getElementById('tituloBusca').value;
        if (!titulo) return;
        lastSearchTerm = titulo;

        const container = document.getElementById('searchResultsContainer');
        const status = document.getElementById('statusBusca');
        document.getElementById('backToSearchBtn').style.display = 'none';
        status.textContent = `Buscando por "${titulo}"...`;
        container.innerHTML = '<div class="spinner-border text-primary" role="status"><span class="visually-hidden">Loading...</span></div>';
        try {
            const res = await fetchWithAuth(`${baseUrl}/buscar-externo?titulo=${encodeURIComponent(titulo)}`);
            const results = await res.json();
            container.innerHTML = '';
            if (results.length === 0) { status.textContent = 'Nenhum resultado encontrado.'; return; }
            status.textContent = 'Resultados da Busca. Clique para ver detalhes ou adicionar:';
            results.forEach(item => {
                const onClickAction = item.resourceType === 'issue' ? `finalizeHqCreation('${item.apiDetailUrl}')` : `showIssuesForVolume(${item.id}, '${item.title.replace(/'/g, "\\'")}')`;
                const cardHtml = `<div class="col"><div class="card h-100 search-result-card" onclick="${onClickAction}"><img src="${item.imageUrl || 'https://via.placeholder.com/500x750.png?text=Sem+Capa'}" class="card-img-top" style="height: 300px; object-fit: cover;" alt="..."><div class="card-body text-center"><h6 class="card-title">${item.title}</h6><p class="card-text text-muted small">${item.volumeName || ''}<br>Ano: ${item.year || 'N/A'}</p><span class="badge bg-secondary">${item.resourceType}</span></div></div></div>`;
                container.innerHTML += cardHtml;
            });
        } catch (error) { status.textContent = 'Erro ao buscar HQs.'; console.error(error); }
    }

    async function showIssuesForVolume(volumeId, volumeTitle) {
        const container = document.getElementById('searchResultsContainer');
        const status = document.getElementById('statusBusca');
        document.getElementById('backToSearchBtn').style.display = 'block';
        status.textContent = `Edições de "${volumeTitle}". Clique para adicionar:`;
        container.innerHTML = '<div class="text-center col-12">Carregando edições...</div>';
        try {
            const res = await fetchWithAuth(`${baseUrl}/buscar-volume-issues?volumeId=${volumeId}`);
            const issues = await res.json();
            container.innerHTML = "";
            if (issues.length === 0) { container.innerHTML = '<p class="text-center col-12">Nenhuma edição encontrada para este volume.</p>'; return; }
            issues.forEach(issue => {
                const title = issue.title;
                const imageUrl = issue.imageUrl || 'https://via.placeholder.com/500x750.png?text=Sem+Capa';
                container.innerHTML += `<div class="col"><div class="card h-100 search-result-card" onclick="finalizeHqCreation('${issue.apiDetailUrl}')"><img src="${imageUrl}" class="card-img-top" style="height: 300px; object-fit: cover;" alt="Capa de ${title}"><div class="card-body text-center"><h6 class="card-title">${title}</h6></div></div></div>`;
            });
        } catch (error) { status.textContent = 'Erro ao buscar edições.'; console.error(error); }
    }

    function goBackToSearch() { searchHqs(lastSearchTerm); }

    async function finalizeHqCreation(apiDetailUrl) {
        const status = document.getElementById('statusBusca');
        status.textContent = "Adicionando a HQ selecionada ao catálogo...";
        try {
            const dto = { apiDetailUrl: apiDetailUrl };
            const res = await fetchWithAuth(baseUrl, { method: 'POST', body: JSON.stringify(dto) });
            if (res.ok) {
                const hqCriada = await res.json();
                status.textContent = `Sucesso! HQ "${hqCriada.titulo}" adicionada.`;
                document.getElementById('searchResultsContainer').innerHTML = '';
                document.getElementById('tituloBusca').value = '';
                refreshAll();
            } else {
                const errorData = await res.json();
                throw new Error(errorData.message || 'Erro desconhecido ao adicionar HQ.');
            }
        } catch (error) { status.textContent = `Erro ao adicionar HQ: ${error.message}`; }
    }
</script>
</body>
</html>
